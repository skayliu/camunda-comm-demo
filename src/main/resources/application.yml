spring:
  datasource:
    url: jdbc:h2:mem:camundadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2
  flyway:
    # 演示 / 单测走 H2：关闭 Flyway，由 sql.init 顺序执行 h2 方言脚本。
    # 两个入口指向同一份 SQL，避免“schema.sql 与迁移脚本各写一遍、然后慢慢漂移”。
    enabled: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/h2/V1__baseline.sql
        - classpath:db/migration/h2/V2__composite_indexes.sql
        - classpath:db/migration/h2/V3__delegate_and_agent.sql
        - classpath:db/migration/h2/V4__agent_delegate_mode.sql

camunda.bpm:
  # Camunda 7.24 默认不再自动部署 classpath 下的 BPMN，需显式开启
  auto-deployment-enabled: true
  deployment-resource-pattern: classpath*:**/*.bpmn
  admin-user:
    id: demo
    password: demo
    firstName: Demo
  filter:
    create: All tasks
  database:
    schema-update: true
  history-level: full

server:
  port: 8080
