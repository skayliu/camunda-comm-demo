spring:
  datasource:
    url: jdbc:h2:mem:camundadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2
  flyway:
    # 演示 / 单测走 H2：关闭 Flyway，由 sql.init 顺序执行 h2 方言脚本。
    # 两个入口指向同一份 SQL，避免“schema.sql 与迁移脚本各写一遍、然后慢慢漂移”。
    enabled: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/h2/V1__baseline.sql
        - classpath:db/migration/h2/V2__composite_indexes.sql
        - classpath:db/migration/h2/V3__delegate_and_agent.sql
        - classpath:db/migration/h2/V4__agent_delegate_mode.sql
        - classpath:db/migration/h2/V5__dept_subprocess_registry.sql

camunda.bpm:
  # Camunda 7.24 默认不再自动部署 classpath 下的 BPMN，需显式开启
  auto-deployment-enabled: true
  deployment-resource-pattern: classpath*:**/*.bpmn
  admin-user:
    id: demo
    password: demo
    firstName: Demo
  filter:
    create: All tasks
  database:
    schema-update: true
  history-level: full
  generic-properties:
    properties:
      # 部门 ID 直接作为 Camunda 的 group id（dept_handle 用候选组承接）。
      # 引擎默认白名单是 "[a-zA-Z0-9]+|camunda-admin"，会把 dept_it / dept_admin
      # 这类带下划线的部门判为非法标识符而拒绝建组，导致部门无人可处理。
      # 这里只放开组 ID 的规则，用户与租户仍沿用默认白名单。
      groupResourceWhitelistPattern: "[a-zA-Z0-9_-]+|camunda-admin"

server:
  port: 8080
  servlet:
    session:
      # 会话式登录：密码只在登录时出现一次，之后凭 JSESSIONID 识别身份。
      # 30 分钟无操作即失效，避免“关了页面凭据还长期有效”。
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
